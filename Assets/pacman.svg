<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 110" width="900" height="110" shape-rendering="crispEdges" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="110" fill="#12062a"/>
  <rect x="4" y="4" width="892" height="102" fill="none" stroke="#2b2bff" stroke-width="4"/>
  <g fill="#ffd23f">
    <!-- dots -->
    <rect x="40" y="53" width="8" height="8"/><rect x="80" y="53" width="8" height="8"/><rect x="120" y="53" width="8" height="8"/>
    <rect x="160" y="53" width="8" height="8"/><rect x="200" y="53" width="8" height="8"/><rect x="240" y="53" width="8" height="8"/>
    <rect x="280" y="53" width="8" height="8"/><rect x="320" y="53" width="8" height="8"/><rect x="360" y="53" width="8" height="8"/>
    <rect x="400" y="53" width="8" height="8"/><rect x="440" y="53" width="8" height="8"/><rect x="480" y="53" width="8" height="8"/>
    <rect x="520" y="53" width="8" height="8"/><rect x="560" y="53" width="8" height="8"/><rect x="600" y="53" width="8" height="8"/>
    <rect x="640" y="53" width="8" height="8"/><rect x="680" y="53" width="8" height="8"/><rect x="720" y="53" width="8" height="8"/>
    <rect x="760" y="53" width="8" height="8"/><rect x="800" y="53" width="8" height="8"/><rect x="840" y="53" width="8" height="8"/>
  </g>
  <!-- eaten trail -->
  <rect x="0" y="35" width="0" height="44" fill="#12062a">
    <animate attributeName="width" values="0;940" dur="9s" repeatCount="indefinite"/>
  </rect>
  <!-- pac-man -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="-40,57;940,57" dur="9s" repeatCount="indefinite"/>
    <path fill="#ffd23f" d="M0,0 L17,-10 A20,20 0 1,0 17,10 Z">
      <animate attributeName="d" values="M0,0 L17,-10 A20,20 0 1,0 17,10 Z;M0,0 L20,-1 A20,20 0 1,0 20,1 Z;M0,0 L17,-10 A20,20 0 1,0 17,10 Z" dur="0.4s" repeatCount="indefinite"/>
    </path>
  </g>
  <!-- ghost chasing -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="-150,57;830,57" dur="9s" repeatCount="indefinite"/>
    <path fill="#ff3da1" d="M-18,18 L-18,-4 A18,18 0 0,1 18,-4 L18,18 L9,10 L0,18 L-9,10 Z"/>
    <circle cx="-7" cy="-4" r="5" fill="#fff"/><circle cx="7" cy="-4" r="5" fill="#fff"/>
    <rect x="-6" y="-5" width="4" height="4" fill="#2b2bff"/><rect x="8" y="-5" width="4" height="4" fill="#2b2bff"/>
  </g>
</svg>
