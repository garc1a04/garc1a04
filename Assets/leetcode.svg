    <rect x="840" y="105" width="4" height="4"><animate attributeName="opacity" values="0.1;1;0.1" dur="1.9s" repeatCount="indefinite"/></rect>
    <rect x="450" y="18" width="4" height="4"><animate attributeName="opacity" values="1;0.1;1" dur="2.8s" repeatCount="indefinite"/></rect>
  </g>
  <rect x="8" y="8" width="884" height="264" fill="none" stroke="#ff3da1" stroke-width="4"/>
  <rect x="16" y="16" width="868" height="248" fill="none" stroke="#ff9f1c" stroke-width="2"/>

  <!-- Nome -->
  <text x="454" y="68" text-anchor="middle" font-family="'Courier New',monospace" font-weight="bold" font-size="44" fill="#12062a">LEETCODE  ·  GARC1A04</text>
  <text x="450" y="64" text-anchor="middle" font-family="'Courier New',monospace" font-weight="bold" font-size="44" fill="#ffd23f">LEETCODE  ·  GARC1A04</text>

  <!-- Estatísticas -->
  <g font-family="'Courier New',monospace" text-anchor="middle" font-weight="bold">
    <text x="150" y="124" font-size="14" letter-spacing="2" fill="#2ec4b6">RESOLVIDOS</text>
    <text x="150" y="158" font-size="36" fill="#ffd23f">37</text>

    <text x="350" y="124" font-size="14" letter-spacing="2" fill="#2ec4b6">EASY</text>
    <text x="350" y="158" font-size="36" fill="#2ec4b6">25</text>

    <text x="550" y="124" font-size="14" letter-spacing="2" fill="#ffd23f">MEDIUM</text>
    <text x="550" y="158" font-size="36" fill="#ffd23f">11</text>

    <text x="750" y="124" font-size="14" letter-spacing="2" fill="#ff3da1">HARD</text>
