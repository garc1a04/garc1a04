  <g fill="#ff3da1">
    <rect x="248" y="108" width="4" height="56"/>
    <rect x="448" y="108" width="4" height="56"/>
    <rect x="648" y="108" width="4" height="56"/>
  </g>

  <!-- Divisor -->
  <rect x="40" y="178" width="820" height="2" fill="#ff9f1c"/>

  <!-- Últimas submissões -->
  <text x="40" y="198" font-family="'Courier New',monospace" font-weight="bold" font-size="13" letter-spacing="2" fill="#2ec4b6">ULTIMAS SUBMISSOES ACEITAS</text>
  <text x="860" y="198" text-anchor="end" font-family="'Courier New',monospace" font-size="11" letter-spacing="2" fill="#8a6fa8">ATUALIZADO EM 06/11/2026</text>
  <g font-family="'Courier New',monospace" font-size="14" fill="#ffd23f">
    <text x="40" y="222">&gt; Longest Common Prefix  [typescript]</text>
