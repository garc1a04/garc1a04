<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280" shape-rendering="crispEdges">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12062a"/><stop offset="1" stop-color="#3a0d4f"/>
    </linearGradient>
  </defs>
  <rect width="900" height="280" fill="url(#bg)"/>
  <g fill="#ffd23f">
